<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ANS Downloader</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      width: 320px;
      padding: 16px;
      margin: 0;
      background-color: #ffffff;
      color: #333333;
    }
    
    .container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    h3 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      color: #111827;
      text-align: center;
    }

    p {
      font-size: 13px;
      color: #6b7280;
      margin: 0;
      text-align: center;
      line-height: 1.4;
    }

    button {
      width: 100%;
      padding: 10px 14px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    }

    button:hover:not(:disabled) {
      background-color: #1d4ed8;
    }

    button:active:not(:disabled) {
      background-color: #1e40af;
      transform: scale(0.98);
    }

    /* New styles for the disabled state */
    button:disabled {
      background-color: #9ca3af;
      cursor: not-allowed;
      box-shadow: none;
    }

    #status {
      font-size: 12px;
      font-weight: 500;
      text-align: center;
      min-height: 16px; /* Prevents layout shift */
    }

    .success {
      color: #16a34a;
    }

    .error {
      color: #dc2626;
    }
  </style>
</head>
<body>
  <div class="container">
    <h3>ANS Exam Downloader</h3>
    <p>Open your exam view on ans.app, then click the button below to extract and download the PDF.</p>
    
    <!-- Button starts disabled by default until we confirm the page -->
    <button id="downloadBtn" disabled>Checking page...</button>
    
    <div id="status"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
